name: Run tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq

      - name: Run shellcheck
        run: find actions -name "*.sh" -print0 | xargs -0 shellcheck

      - name: Run unit tests
        run: bats tests/unit
